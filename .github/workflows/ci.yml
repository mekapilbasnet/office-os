name: Office OS Dynamic Routing offline regression
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    name: Static tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        python-version: ['3.11']
        include:
          # Oldest and newest supported Python, on one OS to keep the matrix small.
          - os: ubuntu-22.04
            python-version: '3.8'
          - os: ubuntu-24.04
            python-version: '3.13'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Python regression tests
        run: python -m unittest discover -s tests -v
      - name: Bash install / verify smoke
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          export CLAUDE_CONFIG_DIR="$(mktemp -d)"
          ./install.sh
          ./install.sh --apply
          ./verify.sh
          python3 office-os/routing-tools/routing_manager.py profile quality --apply
          python3 office-os/routing-tools/routing_manager.py off --apply
          python3 office-os/routing-tools/routing_manager.py on --apply
          python3 office-os/routing-tools/routing_manager.py verify
          python3 office-os/routing-tools/routing_manager.py uninstall --apply
      - name: Native PowerShell install / verify smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:CLAUDE_CONFIG_DIR = Join-Path $env:RUNNER_TEMP 'isolated-claude-officeos'
          ./install.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./install.ps1 --apply
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./verify.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python office-os/routing-tools/routing_manager.py profile quality --apply
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python office-os/routing-tools/routing_manager.py off --apply
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python office-os/routing-tools/routing_manager.py on --apply
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python office-os/routing-tools/routing_manager.py verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python office-os/routing-tools/routing_manager.py uninstall --apply
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  bundled-skill-tests:
    name: Bundled skill tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: ui-ux-pro-max tests
        run: python -m unittest discover -s skills/ui-ux-pro-max/scripts/tests
      - name: design logo tests
        run: python -m unittest discover -s skills/design/scripts/logo/tests
      - name: design shared tests
        run: python -m unittest discover -s skills/design/scripts/tests
      - name: brand tests (use node when available)
        run: python -m unittest discover -s skills/brand/scripts/tests

  lint:
    name: Pyflakes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install pyflakes
        run: python -m pip install pyflakes
      - name: Lint office-os and tests
        run: python -m pyflakes office-os tests
