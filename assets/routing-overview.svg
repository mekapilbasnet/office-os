    <text x="368" y="260" fill="#CBD5E1" font-family="Arial, Helvetica, sans-serif" font-size="15">• auto on/off</text>
    <text x="368" y="284" fill="#CBD5E1" font-family="Arial, Helvetica, sans-serif" font-size="15">• economy / balanced / quality</text>
  </g>

