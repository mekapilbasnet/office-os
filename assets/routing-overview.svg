<svg width="1200" height="620" viewBox="0 0 1200 620" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="620" rx="24" fill="#0F172A"/>
  <text x="60" y="74" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800">Routing Overview</text>
  <text x="60" y="108" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="20">Office OS stays the main skill. Dynamic Routing decides which model pattern to use.</text>

  <g>
