    <text x="88" y="214" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Incoming Task</text>
    <text x="88" y="248" fill="#CBD5E1" font-family="Arial, Helvetica, sans-serif" font-size="16">User request enters</text>
    <text x="88" y="272" fill="#CBD5E1" font-family="Arial, Helvetica, sans-serif" font-size="16">Claude Code session</text>
  </g>

  <g>
